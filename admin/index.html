<!-- PRIMEIRA COISA: conferir a sessão. Sem sessão, vai pro login. -->
<script>
window.PAINEL_PRONTO = (async function conferirSessao() {
  const DONA = "alannaclara.machadoxs@gmail.com";
  if (!window.banco) {
    document.body.innerHTML = '<div class="tela-cheia"><div><p><b>Não consegui conectar ao banco.</b></p><p class="mudo">Confira sua internet e recarregue a página.</p></div></div>';
    document.body.hidden = false;
    return null;
  }
  let sessao = null;
  try {
    const { data } = await banco.auth.getSession();
    sessao = data && data.session;
  } catch (erro) { sessao = null; }
  if (!sessao) { location.replace("../login/"); return null; }
  const email = String((sessao.user && sessao.user.email) || "").toLowerCase();
  if (email !== DONA) {
    await banco.auth.signOut();
    location.replace("../login/");
    return null;
  }
  return sessao;
})();
</script>
