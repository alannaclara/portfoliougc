<style>
/* =========================================================
   LINKS DA BIO
   Mesmo visual do portfólio: as mesmas cores, a estrela, o fundo
   com estrela e rostinhos, os botões de vidro e o nome de vidro.
   Feito para celular: uma coluna só, botões grandes, cupom que
   copia num toque.
   ========================================================= */
:root{
  --creme:#f3eee9;
  --creme-2:#ebe3da;
  --papel:#fbf8f5;
  --tinta:#25404d;
  --tinta-2:#554b41;
  --bloco:#5aacba;
  --clara-no-bloco:#e6fbfd;
  --azul:#a7ebf2;
  --azul-2:#86dde7;
  --azul-claro:#dcf6f9;
  --linha:rgba(23,59,67,.14);
  --linha-forte:rgba(23,59,67,.24);
  --sombra-vidro:inset 0 1px 1px rgba(255,255,255,.85),0 8px 20px -10px rgba(37,64,77,.38);
  --brilho:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,0) 58%);
  --raio:14px;
  --raio-sm:10px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--creme);
  color:var(--tinta);
  font-family:var(--sans);
  font-size:1rem;
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* O cursor de estrela do portfólio */
html,body,*{cursor:url("../fotos/cursor-estrela.png") 16 16,auto}
a,button{cursor:url("../fotos/cursor-estrela.png") 16 16,pointer}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;margin:0;letter-spacing:-.015em}
p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--tinta);outline-offset:3px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Estrelas que flutuam nos cantos (iguais às do portfólio) ---------- */
.ceu{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ceu span{position:absolute;width:var(--t,18px);aspect-ratio:1;background:url("../fotos/estrela.png") center/contain no-repeat;opacity:var(--o,.7);animation:sobrevoar var(--d,9s) ease-in-out var(--a,0s) infinite}
@keyframes sobrevoar{
  0%,100%{transform:translate(0,0) rotate(0) scale(1)}
  30%{transform:translate(10px,-16px) rotate(12deg) scale(1.1)}
  60%{transform:translate(-8px,-26px) rotate(-8deg) scale(.9)}
  80%{transform:translate(-12px,-8px) rotate(4deg) scale(1.04)}
}

/* ---------- Faixa do topo: a cor dos blocos com a estrela e os rostinhos,
   que vai sumindo no creme (sem corte reto) ---------- */
/* O azul termina antes do nome, para o "Clara" ficar em cima do creme, como na capa */
.fundo{position:absolute;inset:0 0 auto;height:200px;z-index:0;overflow:hidden;background:var(--bloco)}
.fundo::before{content:"";position:absolute;inset:0;background:url("../fotos/padrao-servicos.png") 0 0/176px 88px repeat;opacity:.22}
.fundo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(243,238,233,0) 30%,var(--creme) 84%)}

/* ---------- Estrutura ---------- */
.folha{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:44px 20px 96px}

/* ---------- Cabeçalho ---------- */
.topo{text-align:center;margin-bottom:30px}
.retrato-moldura{position:relative;width:120px;height:120px;margin:0 auto 18px}
.retrato{
  width:100%;height:100%;display:block;
  border-radius:50%;object-fit:cover;
  border:4px solid rgba(255,255,255,.75);
  box-shadow:0 18px 34px -16px rgba(23,59,67,.55);
}
/* A estrela da logo, encostada na foto */
.retrato-moldura::after{content:"";position:absolute;right:-6px;bottom:4px;width:34px;height:34px;background:url("../fotos/estrela.png") center/contain no-repeat;filter:drop-shadow(0 2px 3px rgba(23,59,67,.3))}
h1{font-size:2.6rem;line-height:1;margin-bottom:10px;letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--azul)}
.descricao{color:var(--tinta-2);font-size:.95rem;max-width:30ch;margin:0 auto}

/* Nome de vidro: mantém a cor, com o brilho branco no alto (igual ao portfólio) */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .vidro-texto.vidro-texto{
    background-image:linear-gradient(150deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 50%),linear-gradient(currentColor,currentColor);
    background-image:linear-gradient(150deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 50%),linear-gradient(color-mix(in srgb,currentColor 90%,transparent),color-mix(in srgb,currentColor 90%,transparent));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    -webkit-text-stroke:.5px rgba(255,255,255,.55);
  }
}

/* ---------- Vidro: a mesma receita dos botões do portfólio ---------- */
.vidro{position:relative;isolation:isolate;-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);box-shadow:var(--sombra-vidro)}
.vidro::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--brilho);pointer-events:none}

/* ---------- Redes ---------- */
.redes{display:flex;justify-content:center;gap:10px;margin-top:20px}
.rede{
  width:46px;height:46px;display:grid;place-items:center;
  border:1px solid var(--linha-forte);border-radius:50%;
  background-color:rgba(255,255,255,.35);color:var(--tinta);
  transition:transform .25s var(--ease),background-color .25s,color .25s;
}
.rede:hover{transform:translateY(-3px);background-color:var(--tinta);color:var(--azul)}

/* ---------- Botões grandes ---------- */
.botoes{display:grid;gap:12px;margin-bottom:40px}
.botao{
  display:flex;align-items:center;gap:12px;
  min-height:58px;padding:12px 18px;
  border:1.5px solid var(--tinta);border-radius:var(--raio-sm);
  background-color:rgba(255,255,255,.3);
  font-weight:600;font-size:.98rem;
  transition:transform .25s var(--ease),background-color .25s,color .25s;
}
.botao:hover{transform:translateY(-2px);background-color:var(--tinta);color:var(--creme)}
.botao-principal{background-color:color-mix(in srgb,var(--azul) 82%,transparent)}
.botao-principal:hover{color:var(--azul)}
.botao .seta{margin-left:auto;opacity:.55;transition:opacity .25s,transform .25s var(--ease)}
.botao-texto{min-width:0;line-height:1.3}
.botao-texto small{display:block;margin-top:2px;font-size:.78rem;font-weight:500;opacity:.75;overflow-wrap:anywhere}
.botao:hover .seta{opacity:1;transform:translateX(3px)}

/* ---------- Cupons ---------- */
.rotulo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-2)}
.rotulo .estrela{width:26px;height:26px;margin-right:-6px;flex:none;background:url("../fotos/estrela.png") center/contain no-repeat}
.secao-titulo{text-align:center;font-size:2.1rem;line-height:1.05;margin-bottom:22px}
.secao-titulo em{font-style:italic;font-weight:300;padding:0 .08em;background:linear-gradient(transparent 56%,var(--azul) 56%,var(--azul) 90%,transparent 90%)}
/* minmax(0,1fr) e os min-width:0 abaixo impedem um código comprido
   de esticar o cartão e criar rolagem lateral no celular */
.cupons{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.cupom{
  min-width:0;
  padding:16px 18px;
  border:1px solid rgba(255,255,255,.75);border-radius:var(--raio);
  background-color:color-mix(in srgb,var(--papel) 70%,transparent);
}
.cupom-topo{display:flex;align-items:baseline;gap:10px;min-width:0;margin-bottom:12px}
.cupom-marca{min-width:0;font-size:1.22rem;line-height:1.2;overflow-wrap:anywhere}
.cupom-desconto{flex:none;padding:2px 10px;border-radius:999px;background:var(--bloco);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.02em}
.cupom-loja{
  margin-left:auto;flex:none;
  font-size:.78rem;font-weight:600;color:var(--tinta-2);
  display:inline-flex;align-items:center;gap:4px;
  text-decoration:underline;text-decoration-color:var(--linha-forte);text-underline-offset:3px;
}
.cupom-loja:hover{color:var(--tinta);text-decoration-color:var(--tinta)}
.copiar{
  width:100%;min-width:0;display:flex;align-items:center;gap:10px;
  min-height:50px;padding:10px 14px;
  border:1.5px dashed var(--azul-2);border-radius:var(--raio-sm);
  background-color:color-mix(in srgb,var(--azul-claro) 80%,transparent);
  font:inherit;font-weight:700;letter-spacing:.04em;color:var(--tinta);
  text-align:left;
  transition:background-color .2s,border-color .2s;
}
.copiar:hover{background-color:var(--azul);border-color:var(--tinta)}
/* O código nunca é cortado: se faltar espaço, ele quebra a linha */
.copiar .codigo{min-width:0;overflow-wrap:anywhere}
.copiar .rotulo-copiar{margin-left:auto;flex:none;font-size:.74rem;font-weight:600;letter-spacing:normal;color:var(--tinta-2);white-space:nowrap}
.copiar.copiado{background-color:var(--azul);border-style:solid;border-color:var(--tinta)}
.copiar.copiado .rotulo-copiar{color:var(--tinta)}

/* ---------- Rodapé: o bloco azul do portfólio ---------- */
.rodape{position:relative;z-index:1;background:var(--bloco);color:#fff;text-align:center;padding:40px 20px 34px}
.rodape::before{content:"";position:absolute;inset:-60px 0 100%;background:linear-gradient(to bottom,rgba(90,172,186,0),var(--bloco));pointer-events:none}
.rodape-nome{font-family:var(--serif);font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.rodape-nome em{font-style:normal;color:var(--clara-no-bloco)}
.rodape-desc{margin-top:6px;font-size:.78rem;font-weight:600;letter-spacing:.16em;color:rgba(255,255,255,.9)}
.rodape-base{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.3);font-size:.84rem;color:rgba(255,255,255,.9)}
.rodape-base a{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.rodape-base a:hover{color:#fff;text-decoration-color:#fff}

/* Celular estreito: o aviso de copiar sai e sobra espaço para o código */
@media (max-width:359px){
  .copiar .rotulo-copiar{display:none}
  .folha{padding-left:14px;padding-right:14px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<script>
/* =========================================================
   OS CUPONS
   Eles vêm da aba Cupons do painel, então para mexer é lá, sem
   tocar neste arquivo. A página lê a "janelinha" cupons_publicos,
   que só mostra o que está ligado e dentro da validade.

   A lista de reserva aqui embaixo só entra em cena se o banco não
   responder, para a página nunca ficar vazia na frente de ninguém.
   ========================================================= */
const BANCO = "https://rwlbefdxfnvbupwpkdxm.supabase.co";
const CHAVE = "sb_publishable_tv2nNBYjdyxghXpteQmpIg_RCKMpamg";

const CUPONS_RESERVA = [
  { marca: "Saint Germain",   codigo: "A-SGALANNAPA",    link: "https://www.saintgermainbrand.com/" },
  { marca: "Pangeia",         codigo: "ALY10",           link: "https://www.pangeia96.com.br/" },
  { marca: "YesStyle",        codigo: "ACUPOMYS10",      link: "https://www.yesstyle.com/en/home.html" },
  { marca: "Océane",          codigo: "ACHADINHOALANNA", link: "https://www.oceane.com.br/" },
  { marca: "Maria Margarida", codigo: "ACHADINHOALANNA", link: "https://www.mariamargarida.com.br/" }
];

const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icone = (nome, classe) => `<svg class="ico ${classe || ""}" aria-hidden="true"><use href="#i-${nome}"/></svg>`;

async function buscarCupons() {
  try {
    const endereco = BANCO + "/rest/v1/cupons_publicos?select=marca,codigo,link,descricao&order=ordem";
    const resposta = await fetch(endereco, { headers: { apikey: CHAVE, Authorization: "Bearer " + CHAVE } });
    if (!resposta.ok) throw new Error("banco não respondeu");
    const lista = await resposta.json();
    return Array.isArray(lista) && lista.length ? lista : CUPONS_RESERVA;
  } catch (erro) {
    return CUPONS_RESERVA;
  }
}

function desenharCupons(lista) {
  document.getElementById("cupons").innerHTML = lista.map((c) => `
    <article class="cupom vidro">
      <div class="cupom-topo">
        <h3 class="cupom-marca">${esc(c.marca)}</h3>
        ${c.descricao ? `<span class="cupom-desconto">${esc(c.descricao)}</span>` : ""}
        <a class="cupom-loja" href="${esc(c.link)}" target="_blank" rel="noopener">Ir à loja${icone("link")}</a>
      </div>
      <button class="copiar vidro" type="button" data-codigo="${esc(c.codigo)}">
        ${icone("tag")}<span class="codigo">${esc(c.codigo)}</span>
        <span class="rotulo-copiar">copiar</span>
      </button>
    </article>`).join("");
}

buscarCupons().then(desenharCupons);

/* Copiar o cupom.
   Tenta três caminhos, do melhor para o mais antigo, porque nem todo
   navegador libera o primeiro (o Instagram e o TikTok abrem os links
   num navegador interno que às vezes bloqueia):
     1. a forma moderna;
     2. a forma antiga, com uma caixa de texto escondida;
     3. desistir de copiar e deixar o código selecionado para a pessoa
        copiar na mão. Nunca fica sem resposta na tela. */
async function copiarTexto(texto) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
      return true;
    }
  } catch (erro) { /* tenta o próximo */ }
  try {
    const caixa = document.createElement("textarea");
    caixa.value = texto;
    caixa.setAttribute("readonly", "");
    caixa.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(caixa);
    caixa.select();
    caixa.setSelectionRange(0, texto.length);
    const deuCerto = document.execCommand("copy");
    caixa.remove();
    return deuCerto;
  } catch (erro) {
    return false;
  }
}

document.getElementById("cupons").addEventListener("click", async (e) => {
  const botao = e.target.closest(".copiar");
  if (!botao) return;
  const rotulo = botao.querySelector(".rotulo-copiar");
  const deuCerto = await copiarTexto(botao.dataset.codigo);

  if (!deuCerto) {
    const faixa = document.createRange();
    faixa.selectNodeContents(botao.querySelector(".codigo"));
    const selecao = window.getSelection();
    selecao.removeAllRanges();
    selecao.addRange(faixa);
    rotulo.textContent = "copie o código";
    return;
  }

  botao.classList.add("copiado");
  rotulo.textContent = "copiado!";
  clearTimeout(botao.temporizador);
  botao.temporizador = setTimeout(() => {
    botao.classList.remove("copiado");
    rotulo.textContent = "copiar";
  }, 2000);
});

/* E-mail: copia o endereço e deixa o navegador tentar abrir o app de e-mail.
   Se o app não abrir, a pessoa já tem o endereço copiado para colar. */
document.querySelectorAll(".botao-email").forEach((link) => {
  link.addEventListener("click", async () => {
    const email = link.dataset.email;
    const deuCerto = await copiarTexto(email);
    const aviso = document.querySelector(".email-aviso");
    if (!aviso) return;
    aviso.textContent = deuCerto ? "e-mail copiado! " + email : email;
    clearTimeout(aviso.temporizador);
    aviso.temporizador = setTimeout(() => { aviso.textContent = email; }, 4000);
  });
});

document.getElementById("ano").textContent = new Date().getFullYear();
</script>

</body>
</html>
